# model configuration
model:
  seed: 0
  checkpoint: null  # load weights from checkpoint
  model_class: msps_vae
  model_params:
    backbone: resnet18
    num_latents_unsupervised: 8   # z_u; what downstream clustering (cuttle reduce/cluster) reads
    num_latents_background: 4     # z_b; shaped by the triplet loss to organize by video identity
    image_size: 224  # usually 224
    num_channels: 3  # 3 for RGB
    triplet_margin: 1.0
    triplet_weight: 1.0
    positive_window: 1000  # +/- frames (same video) defining a valid triplet-loss positive
    orthogonal_matrix_seed: 42  # seeds the fixed z_u/z_b orthogonal split, not training itself
    use_spatial_loss_weight: false  # down-weight reconstruction MSE near edges/corners
    spatial_loss_weight_r0: 0.5     # normalized radius where the raised-cosine taper begins

# training configuration
training:
  seed: 0
  imgaug: default
  train_batch_size: 512       # per GPU; must be even (ref/pos pairs)
  val_batch_size: 1024
  test_batch_size: 128
  num_epochs: 800
  num_workers: 8              # Number of CPU workers for the DataLoader
  num_gpus: 1
  num_nodes: 1
  log_every_n_steps: 10       # frequency to log training metrics
  check_val_every_n_epoch: 5  # frequency to log validation metrics
  # train on only the first N frames (int) or fraction (0-1) of the train split; subsets are
  # nested across values for a fixed seed; null uses all training frames
  train_frames: null
  precision: 32-true  # trainer precision, e.g. 32-true | bf16-mixed
  # also save a checkpoint every this many epochs, in addition to the best-val checkpoint;
  # null saves only the best-val checkpoint
  ckpt_every_n_epochs: null
  # save contact sheets of validation images/reconstructions to <output_dir>/val_images every
  # this many epochs (should be a multiple of check_val_every_n_epoch); null disables
  viz_every_n_epochs: null
  # number of (evenly spaced, fixed) validation frames to visualize; 32 frames per sheet
  viz_num_frames: 108

# optimizer configuration
optimizer:
  type: AdamW
  accumulate_grad_batches: 1
  scale_lr_by_batch: true  # cosine only: scale lr by global batch size (incl. accumulation) / 256
  lr: 5.e-4
  wd: 0.05
  beta1: 0.9   # adam betas; beta2=0.95 follows the MAE recipe
  beta2: 0.95
  scheduler: cosine  # {step, cosine, constant}
  warmup_pct: 0.15   # for cosine
  div_factor: 10     # for cosine
  final_div_factor: 100  # for cosine; final lr = lr * batch/256 / div_factor / final_div_factor
  gamma: 0.5         # for step
  steps:             # for step
    - 200
    - 400

# data configuration
data:
  data_dir: /PATH/TO/DATA
